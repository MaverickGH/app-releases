name: verify-public-catalog
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install uv==0.12.19
      - run: uv python install 3.12.13
      - name: Download native public candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download mocapgate-v0.3.2 --repo MaverickGH/app-releases --pattern public-catalog-test.zip
      - run: python -m zipfile -e public-catalog-test.zip catalog
      - name: Verify platform selection, server and BVH processing
        working-directory: catalog
        run: |
          uv run --python 3.12.13 --no-project python tests/test_bundle.py .
          uv run --python 3.12.13 --no-project python -m unittest discover tests
