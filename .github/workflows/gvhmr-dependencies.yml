name: gvhmr-dependency-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  imports:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MaverickGH/mocapgate-native-build
          ref: 6c44a02b375cf408e78d0fd0e3b465e53cbee0f1
          ssh-key: ${{ secrets.MOCAPGATE_SOURCE_READ_KEY }}
          persist-credentials: false
      - run: sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y python3-venv git ffmpeg build-essential libgl1 libegl1 libglib2.0-0
      - name: Install actual upstream Linux dependencies and import extension modules
        run: python3 scripts/setup_gvhmr.py --verify-dependencies
