name: gvhmr-dependency-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  imports:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MaverickGH/mocapgate-native-build
          ref: 462a668d13755b757a82f2d84bac45e4a0784121
          ssh-key: ${{ secrets.MOCAPGATE_SOURCE_READ_KEY }}
          persist-credentials: false
      - run: sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y python3-venv python3-tk git ffmpeg build-essential libgl1 libegl1 libglib2.0-0
      - name: Install actual upstream Linux dependencies and import extension modules
        run: python3 scripts/setup_gvhmr.py --verify-dependencies
