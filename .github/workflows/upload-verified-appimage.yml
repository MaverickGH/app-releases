name: upload-verified-appimage
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch the independently tested final artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37204559757 --repo MaverickGH/app-releases --name verified-linux-appimage
      - name: Upload final AppImage to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum MoCapGate-0.3.2-linux-x64.AppImage
          gh release upload mocapgate-v0.3.2 MoCapGate-0.3.2-linux-x64.AppImage --repo MaverickGH/app-releases
